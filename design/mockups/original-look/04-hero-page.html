@font-face{font-family:Cinzel;font-weight:700;src:url(assets/cinzel_bold.ttf)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
#phone{position:relative;width:411px;height:891px;overflow:hidden;background:#0b1622;font-family:Inter;color:#E8E2D6;font-size:14px;line-height:1.3}
.abs{position:absolute}

.ico{width:42px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}

.box{border-style:solid;border-width:15px 11px 9px;color:#231C14;font-family:Crimson;font-size:17px;line-height:1.22}

.card{border-radius:5.5%/4%;box-shadow:0 2px 6px rgba(0,0,0,.65);display:block}
.tok{position:absolute;width:33px;height:33px;margin:-16.5px 0 0 -16.5px;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 2px #15191b,0 0 0 4px var(--t),0 0 0 5px #15191b,0 3px 6px 3px rgba(0,0,0,.55);z-index:6}

.mini{position:absolute;z-index:5;filter:drop-shadow(0 1px 0 rgba(0,0,0,.9)) drop-shadow(0 0 2px rgba(0,0,0,.7))}

.base.blue{box-shadow:0 0 0 1.5px #6FB6F0,0 0 6px 1px rgba(111,182,240,.8)}
.label{position:absolute;z-index:7;font-size:19px;white-space:nowrap;letter-spacing:.5px}
.nowtag{position:absolute;z-index:8;background:#C9A35B;color:#0B1622;font:600 10px Inter;padding:1px 5px;border-radius:3px;letter-spacing:.6px}
.num{position:absolute;z-index:5;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:rgba(11,22,34,.82);border:1px solid #F3EBD6;color:#fff;font:600 11px/16px Inter;text-align:center}
.chip{display:flex;align-items:center;gap:6px;height:44px;padding:0 6px 0 7px;flex:1;min-width:0}
.ph{width:30px;height:30px;border-radius:50%;background-size:cover;background-position:center;flex:none;box-shadow:0 0 0 1px #111,0 0 0 2.5px var(--t),0 0 0 3.5px #111}
.btn{display:flex;align-items:center;justify-content:center;height:48px;border-radius:7px;font-weight:600;font-size:15px;color:#0B1622;background:linear-gradient(#E4C47E,#C9A35B 55%,#A98744);box-shadow:inset 0 1px rgba(255,255,255,.6),inset 0 -1px rgba(0,0,0,.35),0 0 0 1px #15191b,0 2px 5px rgba(0,0,0,.6)}
.ghost{background:linear-gradient(#34424b,#222c33);color:#E8E2D6;box-shadow:inset 0 1px rgba(255,255,255,.18),0 0 0 1px #0e1215,0 2px 5px rgba(0,0,0,.6)}
.small{font-size:12.5px;color:#C9D2DA}
.stars{color:#E8B04A;font-size:12px;letter-spacing:1px}
.nav{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;z-index:30}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:#C9D2DA}
.nav svg{width:24px;height:24px}
.nav .on{color:#E4C47E;font-weight:600}
.nav .on svg{filter:sepia(1) saturate(3) hue-rotate(-12deg) brightness(.95)}
