# The web app (ADR-043): tests on every pull request that touches it; on main, the same checks and
# then a deploy to GitHub Pages (https://quintond.github.io/goa-companion/).
# Supply chain (web review R2): every action is pinned to a commit (the tag in the comment), the
# token is read-only except for the deploy job's Pages permissions, no secrets are used, checkout
# keeps no credentials, and only main deploys. Bump a pin by resolving the new tag's commit.
# The site also carries the Android download at android/ (ADR-048): the newest release's APK, fetched
# at deploy. After publishing a release, run this workflow on main (gh workflow run web-pages.yml).
name: Web app

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "core/**"
      - "app/src/main/assets/**"
      - "app/build.gradle.kts"
      - "design/icons/**"
      - "third_party/fonts/**"
      - "gradle/**"
      - "build-logic/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "kotlin-js-store/**"
      - ".github/workflows/web-pages.yml"
  pull_request:
    paths:
      - "web/**"
      - "core/**"
      - "app/src/main/assets/**"
      - "app/build.gradle.kts"
      - "design/icons/**"
      - "third_party/fonts/**"
      - "gradle/**"
      - "build-logic/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "kotlin-js-store/**"
      - ".github/workflows/web-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Unit tests, lint and the production site
        run: ./gradlew :web:app:jsTest :web:app:detekt :web:app:ktlintCheck :web:app:site

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/e2e/package-lock.json

      - name: Playwright (WebKit as iPhone 15, Chromium as Pixel 7)
        working-directory: web/e2e
        env:
          GOA_SITE_DIR: ${{ github.workspace }}/web/app/build/site
        run: |
          npm ci
          npx playwright install --with-deps webkit chromium
          npx playwright test

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/e2e/playwright-report
            web/e2e/test-results
          retention-days: 7

      - name: The Android download (ADR-048)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 web/android/add_download.py web/app/build/site

      - name: Site artifact for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/app/build/site

  deploy:
    name: Deploy to GitHub Pages
    # Only main is published (a manual run on another branch tests it, never deploys it).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
