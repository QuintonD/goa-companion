# The web app (ADR-043): tests on every pull request that touches it; on main, the same checks and
# then a deploy to GitHub Pages (https://quintond.github.io/goa-companion/).
name: Web app

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "core/**"
      - "app/src/main/assets/**"
      - "app/build.gradle.kts"
      - "design/icons/**"
      - "third_party/fonts/**"
      - "gradle/**"
      - "build-logic/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "kotlin-js-store/**"
      - ".github/workflows/web-pages.yml"
  pull_request:
    paths:
      - "web/**"
      - "core/**"
      - "app/src/main/assets/**"
      - "app/build.gradle.kts"
      - "design/icons/**"
      - "third_party/fonts/**"
      - "gradle/**"
      - "build-logic/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "kotlin-js-store/**"
      - ".github/workflows/web-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint and the production site
        run: ./gradlew :web:app:jsTest :web:app:detekt :web:app:ktlintCheck :web:app:site

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/e2e/package-lock.json

      - name: Playwright (WebKit as iPhone 15, Chromium as Pixel 7)
        working-directory: web/e2e
        env:
          GOA_SITE_DIR: ${{ github.workspace }}/web/app/build/site
        run: |
          npm ci
          npx playwright install --with-deps webkit chromium
          npx playwright test

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/e2e/playwright-report
            web/e2e/test-results
          retention-days: 7

      - name: Site artifact for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/app/build/site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
